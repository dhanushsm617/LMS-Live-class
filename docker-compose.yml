# Local infrastructure: MongoDB, Redis (BullMQ + Socket.IO adapter) and a LiveKit WebRTC server.
#   docker compose up -d
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"          # signalling (ws)
      - "7881:7881"          # WebRTC over TCP
      - "7882:7882/udp"      # WebRTC over UDP
    # --dev mode uses API key "devkey" / secret "secret" (matches .env.example)

volumes:
  mongo-data:
  redis-data:
